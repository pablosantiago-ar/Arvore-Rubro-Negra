<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Árvore Rubro-Negra Interativa</title>
    <style>
      :root {
        --cor-vermelha: #b71c1c;
        --cor-preta: #2c2c2c;
        --cor-sucesso: #28a745;
        --cor-erro: #dc3545;
        --cor-info: #007bff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #fdf6f6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem 1rem;
        color: var(--cor-preta);
      }
      header { text-align: center; margin-bottom: 1rem; }
      header h1 {
        margin: 0;
        font-weight: 700;
        color: var(--cor-vermelha);
        text-shadow: 0 1px 2px rgba(0,0,0,0.1);
      }
      
      .controls {
        display: flex;
        gap: 20px;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
        justify-content: center;
        padding: 1rem;
      }
      .control-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 15px;
        background-color: #fff;
        border-radius: 12px;
        box-shadow: 0 6px 15px rgba(0,0,0,0.08);
        border: 1px solid #eee;
      }
      .control-group h2 {
        margin: 0 0 5px 0;
        text-align: center;
        font-size: 1.1rem;
        color: var(--cor-vermelha);
      }
      .control-group input, .control-group textarea {
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 1rem;
        width: 180px;
        text-align: center;
      }
       .control-group textarea {
        min-height: 60px;
        text-align: left;
      }
      .control-group button {
        padding: 10px 15px;
        border: none;
        border-radius: 6px;
        color: white;
        cursor: pointer;
        font-size: 1rem;
        transition: background-color 0.3s, transform 0.2s;
      }
      .control-group button:hover { transform: translateY(-2px); }
      .insert-btn { background-color: var(--cor-sucesso); }
      .delete-btn { background-color: var(--cor-erro); }
      .search-btn { background-color: var(--cor-info); }

      #status-message {
        margin-top: 1rem;
        font-weight: bold;
        min-height: 24px;
        text-align: center;
        transition: color 0.4s;
      }

      #treeContainer {
        position: relative;
        width: 100%;
        max-width: 1000px;
        min-height: 400px;
        background: white;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        overflow: auto;
        padding: 1rem;
      }
      .node {
        position: absolute;
        width: 55px;
        height: 55px;
        border-radius: 50%;
        color: white;
        font-weight: 700;
        font-size: 1.3rem;
        display: flex;
        justify-content: center;
        align-items: center;
        user-select: none;
        box-shadow: 0 3px 6px rgba(0,0,0,0.2);
        transition: all 0.3s ease;
        z-index: 10;
        cursor: pointer; /* Indica que o nó é clicável */
      }
      .node:hover {
        transform: scale(1.15);
        box-shadow: 0 6px 12px rgba(0,0,0,0.35);
      }
      .node.red { background-color: var(--cor-vermelha); border: 2.5px solid #7f1414; }
      .node.black { background-color: var(--cor-preta); border: 2.5px solid #1a1a1a; }
      
      svg {
        position: absolute; top: 0; left: 0;
        overflow: visible; pointer-events: none; z-index: 1;
      }

      /* Estilos do Modal */
      #file-modal {
        position: fixed;
        z-index: 1000;
        left: 0; top: 0;
        width: 100%; height: 100%;
        background-color: rgba(0,0,0,0.5);
        display: none; /* Inicia oculto */
        align-items: center;
        justify-content: center;
      }
      .modal-content {
        background-color: #fefefe;
        padding: 25px;
        border: 1px solid #888;
        width: 80%;
        max-width: 500px;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        position: relative;
      }
      .close-btn {
        color: #aaa;
        position: absolute;
        top: 10px; right: 20px;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
      }
      #modal-text {
        white-space: pre-wrap; /* Preserva quebras de linha e espaços */
        font-family: monospace;
        background: #f4f4f4;
        padding: 15px;
        border-radius: 5px;
        max-height: 60vh;
        overflow-y: auto;
      }

      footer { margin-top: 2rem; font-size: 0.9rem; color: #777; }
    </style>
</head>
<body>

<header>
  <h1>Árvore Rubro-Negra Interativa</h1>
</header>

<div class="controls">
    <div class="control-group">
        <h2>Inserir Nó</h2>
        <input type="number" id="insert-value" placeholder="Digite um valor" />
        <textarea id="insert-content" placeholder="Conteúdo do arquivo..."></textarea>
        <button id="insert-btn" class="insert-btn">Inserir</button>
    </div>
    <div class="control-group">
        <h2>Remover Nó</h2>
        <input type="number" id="delete-value" placeholder="Digite um valor" />
        <button id="delete-btn" class="delete-btn">Remover</button>
    </div>
    <div class="control-group">
        <h2>Buscar Nó</h2>
        <input type="number" id="search-value" placeholder="Digite um valor" />
        <button id="search-btn" class="search-btn">Buscar</button>
    </div>
</div>

<div id="status-message" aria-live="polite"></div>

<div id="treeContainer" aria-label="Visualização da árvore"></div>

<div id="file-modal">
  <div class="modal-content">
    <span class="close-btn">&times;</span>
    <h3>Conteúdo do Arquivo do Nó</h3>
    <pre id="modal-text">Carregando...</pre>
  </div>
</div>

<footer>© 2025 - Engenharia de computação 2024.1</footer>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- Referências da DOM ---
    const insertBtn = document.getElementById('insert-btn');
    const deleteBtn = document.getElementById('delete-btn');
    const searchBtn = document.getElementById('search-btn');
    const insertValueInput = document.getElementById('insert-value');
    const insertContentInput = document.getElementById('insert-content');
    const deleteValueInput = document.getElementById('delete-value');
    const searchValueInput = document.getElementById('search-value');
    const treeContainer = document.getElementById('treeContainer');
    const statusMessage = document.getElementById('status-message');
    const modal = document.getElementById('file-modal');
    const modalText = document.getElementById('modal-text');
    const closeModalBtn = document.querySelector('.close-btn');

    // --- Funções de UI ---

    function showStatus(text, type = 'info') {
        statusMessage.textContent = text;
        statusMessage.style.color = `var(--cor-${type}, var(--cor-info))`;
    }

    function showModal(content) {
        modalText.textContent = content;
        modal.style.display = 'flex';
    }

    function hideModal() {
        modal.style.display = 'none';
    }

    // --- Funções de API e Árvore ---

    async function refreshTree() {
        try {
            const response = await fetch(`/tree.json?t=${new Date().getTime()}`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const treeData = await response.json();
            drawTree(treeContainer, treeData);
        } catch (error) {
            console.error("Erro ao redesenhar a árvore:", error);
            showStatus('Erro ao atualizar a visualização.', 'error');
        }
    }

    async function handleApiRequest(operation, body) {
        showStatus('Processando...', 'info');
        try {
            const response = await fetch(`/${operation}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message);

            showStatus(result.message, 'success');
            await refreshTree();
        } catch (error) {
            showStatus(`Erro: ${error.message}`, 'error');
        }
    }
    
    // --- Funções de Desenho ---

    function createLine(x1, y1, x2, y2) {
        const line = document.createElementNS("http://www.w3.org/2000/svg", 'line');
        line.setAttribute('x1', x1); line.setAttribute('y1', y1);
        line.setAttribute('x2', x2); line.setAttribute('y2', y2);
        line.setAttribute('stroke', '#4a4a4a'); line.setAttribute('stroke-width', 2);
        return line;
    }
    
    function drawTree(container, treeJson) {
        container.innerHTML = ''; 
        if (!treeJson) {
            container.innerHTML = '<p style="text-align:center; padding-top:20px;">A árvore está vazia.</p>';
            return;
        }

        const svg = document.createElementNS("http://www.w3.org/2000/svg", 'svg');
        container.appendChild(svg);

        const positions = new Map();
        let maxLevel = 0;

        const queue = [{ node: treeJson, level: 0, x: container.clientWidth / 2, width: container.clientWidth / 2 }];
        while(queue.length > 0){
            const { node, level, x, width } = queue.shift();
            positions.set(node.value, { x, y: level * 110 + 60, node });
            maxLevel = Math.max(maxLevel, level);
            if(node.left) queue.push({ node: node.left, level: level + 1, x: x - width / 2, width: width / 2 });
            if(node.right) queue.push({ node: node.right, level: level + 1, x: x + width / 2, width: width / 2 });
        }

        positions.forEach(pos => {
            if (pos.node.left) {
                const childPos = positions.get(pos.node.left.value);
                if (childPos) svg.appendChild(createLine(pos.x, pos.y, childPos.x, childPos.y));
            }
            if (pos.node.right) {
                const childPos = positions.get(pos.node.right.value);
                if (childPos) svg.appendChild(createLine(pos.x, pos.y, childPos.x, childPos.y));
            }
        });

        positions.forEach(pos => {
            const div = document.createElement('div');
            div.className = `node ${pos.node.color}`;
            div.style.left = (pos.x - 27.5) + 'px';
            div.style.top = (pos.y - 27.5) + 'px';
            div.textContent = pos.node.value;
            // Adiciona o evento de clique para abrir o arquivo
            div.addEventListener('click', async () => {
                showModal('Carregando conteúdo...');
                try {
                    const response = await fetch(`/file/${pos.node.value}`);
                    const result = await response.json();
                    if (!result.success) throw new Error(result.message);
                    showModal(result.content);
                } catch (error) {
                    showModal(`Erro ao carregar arquivo: ${error.message}`);
                }
            });
            container.appendChild(div);
        });

        const treeHeight = (maxLevel + 1) * 110 + 40;
        svg.setAttribute('width', container.clientWidth);
        svg.setAttribute('height', treeHeight);
        container.style.height = `${treeHeight}px`;
    }

    // --- Event Listeners ---

    insertBtn.addEventListener('click', () => {
        const value = insertValueInput.value;
        const content = insertContentInput.value;
        if (!value) {
            showStatus('Por favor, digite um valor para o nó.', 'error');
            return;
        }
        handleApiRequest('insert', { value, content });
        insertValueInput.value = '';
        insertContentInput.value = '';
    });

    deleteBtn.addEventListener('click', () => {
        const value = deleteValueInput.value;
        if (!value) {
            showStatus('Por favor, digite um valor para remover.', 'error');
            return;
        }
        handleApiRequest('delete', { value });
        deleteValueInput.value = '';
    });

    searchBtn.addEventListener('click', async () => {
        const value = searchValueInput.value;
        if (!value) {
            showStatus('Por favor, digite um valor para buscar.', 'error');
            return;
        }
        showStatus('Buscando...', 'info');
        try {
            const response = await fetch(`/search?value=${value}`);
            const result = await response.json();
            showStatus(result.message, result.found ? 'success' : 'error');
        } catch (error) {
            showStatus('Erro ao comunicar com o servidor.', 'error');
        }
    });

    closeModalBtn.addEventListener('click', hideModal);
    window.addEventListener('click', (event) => {
        if (event.target == modal) {
            hideModal();
        }
    });

    // --- Inicialização ---
    refreshTree();
    window.addEventListener('resize', refreshTree);
});
</script>

</body>
</html>
